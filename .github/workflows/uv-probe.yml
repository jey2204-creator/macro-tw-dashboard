name: 美股預估本益比資料源探測（暫時）

# 暫時性探測：spglobal.com 的 sp-500-eps-est.xlsx 對 GitHub 主機回 403（Security Controls Triggered，兩種 UA 皆同）；
# 改測 FactSet Insight 部落格（HubSpot）的 RSS 與週報文章能否抓到「forward 12-month P/E ratio is X」，
# 原始檔推到 uv-probe-out 分支讓工作環境驗證解析（工作環境 shell 連不到這些網站）。
# 觸發：非 main 分支 commit 訊息含 [probe]。確認可行並寫好解析後即移除此 workflow。
on:
  push:
    branches-ignore: [main, preview-data, uv-probe-out]

permissions:
  contents: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 下載（Node fetch，誠實 UA，與正式管線相同）
        run: |
          mkdir -p /tmp/probe
          cat > /tmp/probe/fetch.mjs <<'JS'
          import { writeFileSync } from 'node:fs';
          const UA = 'macro-tw-dashboard/0.1 (+https://github.com/jey2204-creator/macro-tw-dashboard)';
          const urls = {
            'factset-rss.xml': 'https://insight.factset.com/rss.xml',
            'factset-post.html': 'https://insight.factset.com/sp-500-earnings-season-update-october-16-2026',
            'factset-topic.html': 'https://insight.factset.com/topic/earnings',
          };
          const log = [];
          for (const [name, url] of Object.entries(urls)) {
            try {
              const res = await fetch(url, { headers: { 'User-Agent': UA, Accept: '*/*' }, redirect: 'follow' });
              const buf = Buffer.from(await res.arrayBuffer());
              const text = buf.toString('utf8');
              const m = /forward 12-month P\/E ratio[^.]{0,40}?is (\d+(?:\.\d+)?)/i.exec(text.replace(/<[^>]*>/g, ' '));
              log.push(`${name}: HTTP ${res.status} ${res.headers.get('content-type')} ${buf.length} bytes fwdPE=${m ? m[1] : 'n/a'}`);
              writeFileSync(`/tmp/probe/${name}`, buf);
            } catch (e) {
              log.push(`${name}: ERROR ${e.message}`);
            }
          }
          writeFileSync('/tmp/probe/log.txt', log.join('\n') + '\n');
          console.log(log.join('\n'));
          JS
          node /tmp/probe/fetch.mjs
          for l in $(seq 1 3); do :; done
          while IFS= read -r line; do echo "::notice title=探測::$line"; done < /tmp/probe/log.txt
      - name: 推送到 uv-probe-out 分支
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd /tmp/probe
          rm -f fetch.mjs
          git init -q -b uv-probe-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "探測輸出 $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" uv-probe-out
