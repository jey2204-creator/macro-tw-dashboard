name: 外資籌碼歷史回補

# 一次性：把外資買賣超（證交所 BFI82U）與外資台指期／散戶小台淨未平倉（期交所）回補到 2010 年，
# 存進 data/chips-history.json，供外資籌碼對照面板的百分位與事件回測。
# 期交所 300 天一段約 1 分鐘；證交所每個交易日 1 個請求、間隔 2.5 秒，全部約 3 小時；
# 每次執行最多 5 小時，未完成會自動接著跑下一次。每段結束後觸發「更新資料並部署」。
# probe：只測試指定日期能否解析（逗號分隔），不寫檔。

on:
  workflow_dispatch:
    inputs:
      probe:
        description: '只測試這些日期（例如 2010-03-02,2020-03-19），留空＝正式回補'
        type: string
        default: ''
      raw:
        description: 'probe 時印出期交所原始回應（診斷用）'
        type: boolean
        default: false
      target:
        description: '回補到哪一天（最早）'
        type: string
        default: '2010-01-04'

permissions:
  contents: write
  actions: write

concurrency:
  group: chips-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 測試解析
        if: ${{ inputs.probe != '' }}
        run: npx tsx scripts/fetch-data/chipsBackfill.ts --probe "${{ inputs.probe }}" ${{ inputs.raw && '--raw' || '' }}

      - name: 回補
        id: run
        if: ${{ inputs.probe == '' }}
        continue-on-error: true
        run: npx tsx scripts/fetch-data/chipsBackfill.ts --target "${{ inputs.target }}" --budget-min 300

      - name: 提交進度
        if: ${{ inputs.probe == '' && always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chips-history.json
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          rows=$(grep -c '^\["' data/chips-history.json || true)
          git commit -m "data: 外資籌碼歷史回補（共 ${rows} 天）"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: 接續下一段
        if: ${{ inputs.probe == '' && steps.run.outputs.remaining == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run chips-backfill.yml -f target="${{ inputs.target }}"

      - name: 重新部署網站
        if: ${{ inputs.probe == '' && always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-and-deploy.yml
