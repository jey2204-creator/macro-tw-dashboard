name: 韓國外資資料來源探測

# 一次性探測：KRX 是否仍可匿名查詢、Naver 投資人別日資料的格式與歷史深度。
# 結果以 ::notice:: 輸出（工作環境讀不到 Actions 日誌，經 check-runs annotations API 讀取；每步驟上限 10 則）。
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/kr-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 準備探測腳本
        run: |
          cat > /tmp/probe.mjs <<'EOF'
          const CH = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36';
          const ME = 'macro-tw-dashboard/0.1 (+https://github.com/jey2204-creator/macro-tw-dashboard)';
          const note = (t, m) => console.log(`::notice title=${t}::${String(m).replace(/[\r\n%]+/g, ' ').slice(0, 900)}`);
          const strip = (s) => s.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
          async function get(url, opt = {}) {
            const t0 = Date.now();
            try {
              const r = await fetch(url, { ...opt, signal: AbortSignal.timeout(30000) });
              const buf = new Uint8Array(await r.arrayBuffer());
              return { status: r.status, ms: Date.now() - t0, buf, headers: r.headers };
            } catch (e) { return { status: 'ERR ' + String(e).slice(0, 120), ms: Date.now() - t0, buf: new Uint8Array(), headers: new Headers() }; }
          }
          function naverRows(html) {
            const rows = [];
            for (const m of html.matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/g)) {
              const cells = [...m[1].matchAll(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/g)].map((c) => strip(c[1]));
              if (cells.length >= 5) rows.push(cells.join('|'));
            }
            return rows;
          }
          const group = process.argv[2];
          async function show(name, url, h = {}) {
            const r = await get(url, { headers: { 'User-Agent': CH, Accept: 'application/json, text/plain, */*', ...h } });
            const ct = r.headers.get('content-type') ?? '';
            let txt = new TextDecoder().decode(r.buf);
            if (!/json/.test(ct)) txt = strip(txt.replace(/<script[\s\S]*?<\/script>/g, ''));
            const keys = /json/.test(ct) ? [...new Set([...txt.matchAll(/"([A-Za-z]*(?:[Dd]eal|[Tt]rend|[Ii]nvest|[Ff]oreign)[A-Za-z]*)"/g)].map((m) => m[1]))].join(',') : '';
            note(name, `status=${r.status} ${r.ms}ms ct=${ct.split(';')[0]} size=${r.buf.length} keys=[${keys}] | ${txt.slice(0, 380)}`);
          }
          const NV = 'https://m.stock.naver.com/api/index/KOSPI';
          const DR = { Referer: 'https://finance.daum.net/domestic/investors' };
          async function json(url, h = {}) {
            const r = await get(url, { headers: { 'User-Agent': CH, Accept: 'application/json', ...h } });
            try { return { r, j: JSON.parse(new TextDecoder().decode(r.buf)) }; } catch { return { r, j: null }; }
          }
          if (group === 'compare') {
            const days = ['20261016', '20261015', '20261014', '20261013', '20240805', '20200319', '20100115', '20080102'];
            const daum = new Map();
            for (const pg of [1]) {
              const { j } = await json(`https://finance.daum.net/api/market_index/days?page=${pg}&perPage=10&market=KOSPI&pagination=true`, DR);
              for (const d of j?.data ?? []) daum.set(d.date.slice(0, 10).replace(/-/g, ''), d);
            }
            const out = [];
            for (const d of days) {
              const { j } = await json(`${NV}/trend?bizdate=${d}`);
              const dm = daum.get(d);
              out.push(`${d} NV外${j?.foreignValue}/個${j?.personalValue}/機${j?.institutionalValue} DM外${dm ? Math.round(dm.foreignStraightPurchasePrice / 1e8) : '-'}/個${dm ? Math.round(dm.individualStraightPurchasePrice / 1e8) : '-'}/機${dm ? Math.round(dm.institutionStraightPurchasePrice / 1e8) : '-'}`);
              await new Promise((res) => setTimeout(res, 300));
            }
            note('NV vs Daum (億)', out.slice(0, 4).join(' ;; '));
            note('NV old days', out.slice(4).join(' ;; '));
          }
          if (group === 'depth') {
            for (const [pg, per] of [[1, 100], [10, 100], [30, 100], [45, 100], [60, 100]]) {
              const { r, j } = await json(`https://finance.daum.net/api/market_index/days?page=${pg}&perPage=${per}&market=KOSPI&pagination=true`, DR);
              const data = j?.data ?? [];
              const meta = j ? Object.entries(j).filter(([k]) => k !== 'data').map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v).slice(0, 80) : v}`).join(' ') : '';
              const f = data[0], l = data.at(-1);
              note(`Daum p${pg}x${per}`, `status=${r.status} ${r.ms}ms rows=${data.length} ${f?.date?.slice(0, 10)}→${l?.date?.slice(0, 10)} 外(億) ${f ? Math.round(f.foreignStraightPurchasePrice / 1e8) : '-'}…${l ? Math.round(l.foreignStraightPurchasePrice / 1e8) : '-'} meta: ${meta}`);
              await new Promise((res) => setTimeout(res, 500));
            }
            const { r, j } = await json('https://finance.daum.net/api/investor/KOSPI/days?page=1&perPage=3&pagination=true&details=true', DR);
            note('Daum investor details', `status=${r.status} | ${JSON.stringify(j).slice(0, 600)}`);
          }
          EOF
      - name: Naver 與 Daum 數字比對
        run: node /tmp/probe.mjs compare
      - name: Daum 歷史深度
        run: node /tmp/probe.mjs depth
