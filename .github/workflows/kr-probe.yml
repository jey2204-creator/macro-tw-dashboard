name: 韓國外資資料來源探測

# 一次性探測：KRX 是否仍可匿名查詢、Naver 投資人別日資料的格式與歷史深度。
# 結果以 ::notice:: 輸出（工作環境讀不到 Actions 日誌，經 check-runs annotations API 讀取；每步驟上限 10 則）。
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/kr-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 準備探測腳本
        run: |
          cat > /tmp/probe.mjs <<'EOF'
          const CH = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36';
          const ME = 'macro-tw-dashboard/0.1 (+https://github.com/jey2204-creator/macro-tw-dashboard)';
          const note = (t, m) => console.log(`::notice title=${t}::${String(m).replace(/[\r\n%]+/g, ' ').slice(0, 900)}`);
          const strip = (s) => s.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
          async function get(url, opt = {}) {
            const t0 = Date.now();
            try {
              const r = await fetch(url, { ...opt, signal: AbortSignal.timeout(30000) });
              const buf = new Uint8Array(await r.arrayBuffer());
              return { status: r.status, ms: Date.now() - t0, buf, headers: r.headers };
            } catch (e) { return { status: 'ERR ' + String(e).slice(0, 120), ms: Date.now() - t0, buf: new Uint8Array(), headers: new Headers() }; }
          }
          function naverRows(html) {
            const rows = [];
            for (const m of html.matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/g)) {
              const cells = [...m[1].matchAll(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/g)].map((c) => strip(c[1]));
              if (cells.length >= 5) rows.push(cells.join('|'));
            }
            return rows;
          }
          const group = process.argv[2];
          async function show(name, url, h = {}) {
            const r = await get(url, { headers: { 'User-Agent': CH, Accept: 'application/json, text/plain, */*', ...h } });
            const ct = r.headers.get('content-type') ?? '';
            let txt = new TextDecoder().decode(r.buf);
            if (!/json/.test(ct)) txt = strip(txt.replace(/<script[\s\S]*?<\/script>/g, ''));
            const keys = /json/.test(ct) ? [...new Set([...txt.matchAll(/"([A-Za-z]*(?:[Dd]eal|[Tt]rend|[Ii]nvest|[Ff]oreign)[A-Za-z]*)"/g)].map((m) => m[1]))].join(',') : '';
            note(name, `status=${r.status} ${r.ms}ms ct=${ct.split(';')[0]} size=${r.buf.length} keys=[${keys}] | ${txt.slice(0, 380)}`);
          }
          const NV = 'https://m.stock.naver.com/api/index/KOSPI';
          const DR = { Referer: 'https://finance.daum.net/domestic/investors' };
          if (group === 'naver1') {
            await show('NV trend bizdate', `${NV}/trend?bizdate=20261010`);
            await show('NV trend page', `${NV}/trend?pageSize=20&page=1`);
            await show('NV trend startIdx', `${NV}/trend?startIdx=0&pageSize=20`);
            await show('NV integration', `${NV}/integration`);
            await show('NV price', `${NV}/price?pageSize=3&page=1`);
            await show('NV investorTrend', `${NV}/investorTrend?pageSize=5&page=1`);
            await show('NV trend list', `${NV}/trend/list?pageSize=5&page=1`);
            await show('NV trend day', `${NV}/trend/day?pageSize=5&page=1`);
          }
          if (group === 'naver2') {
            await show('NV stock integ', 'https://m.stock.naver.com/api/stock/005930/integration');
            await show('NV stock trend', 'https://m.stock.naver.com/api/stock/005930/trend?pageSize=3&bizdate=20261016');
            await show('NV front investor', 'https://m.stock.naver.com/front-api/index/investorTrend?indexCode=KOSPI&pageSize=5');
            await show('NV front deal', 'https://m.stock.naver.com/front-api/marketIndex/investorDealTrend?category=KOSPI&pageSize=5');
            await show('NV KOSDAQ trend', 'https://m.stock.naver.com/api/index/KOSDAQ/trend');
            await show('NV trend 2010', `${NV}/trend?bizdate=20100115`);
          }
          if (group === 'daum') {
            await show('Daum index days', 'https://finance.daum.net/api/market_index/days?page=1&perPage=3&market=KOSPI&pagination=true', DR);
            await show('Daum investor days', 'https://finance.daum.net/api/investor/days?page=1&perPage=5&market=KOSPI&pagination=true', DR);
            await show('Daum investor KOSPI days', 'https://finance.daum.net/api/investor/KOSPI/days?page=1&perPage=5&pagination=true', DR);
            await show('Daum investor market', 'https://finance.daum.net/api/investor/market?market=KOSPI&page=1&perPage=5', DR);
            await show('Daum investor trend', 'https://finance.daum.net/api/investor/trend?market=KOSPI&page=1&perPage=5', DR);
            await show('Daum investor', 'https://finance.daum.net/api/investor?market=KOSPI&page=1&perPage=5', DR);
            await show('Daum page', 'https://finance.daum.net/domestic/investors', {});
          }
          EOF
      - name: Naver 新版 API（指數）
        run: node /tmp/probe.mjs naver1
      - name: Naver 新版 API（其他）
        run: node /tmp/probe.mjs naver2
      - name: Daum
        run: node /tmp/probe.mjs daum
