name: 台股預估本益比資料源探測（暫時）

# 暫時性探測：MSCI 台灣指數官方頁／factsheet（P/E Fwd）能否從 GitHub 主機抓到，以及 Wayback Machine 存檔數量。
# 原始回應推到 tv-probe-out 分支讓工作環境驗證解析（工作環境 shell 連不到這些網站）。
# 觸發：非 main 分支 commit 訊息含 [probe]。確認可行後即移除此 workflow。
on:
  push:
    branches-ignore: [main, preview-data, tv-probe-out]

permissions:
  contents: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝 pdftotext
        run: sudo apt-get install -y -q poppler-utils > /dev/null
      - name: 下載（Node fetch，誠實 UA）
        run: |
          mkdir -p /tmp/probe
          node scripts/probe/fwdProbe.mjs /tmp/probe
          for f in /tmp/probe/wb/*.pdf; do
            [ -s "$f" ] || continue
            pdftotext -layout "$f" "${f%.pdf}.txt" 2>/dev/null || echo "pdftotext 失敗 $f" >> /tmp/probe/log.txt
          done
          while IFS= read -r line; do echo "::notice title=探測::$line"; done < <(head -n 30 /tmp/probe/log.txt)
      - name: 推送到 tv-probe-out 分支
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd /tmp/probe
          git init -q -b tv-probe-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "探測輸出 $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" tv-probe-out
