name: 資料來源連線診斷

on:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 中華航運網 集裝箱市場評述
        shell: bash
        run: |
          mkdir -p /tmp/out
          timeout 18m python3 -u - > /tmp/out/news.txt 2>&1 <<'PY'
          import urllib.request, re, time, json
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          B="https://info.chineseshipping.com.cn/cninfo/MarketReport/Container/"
          def get(u):
              for i in range(3):
                  try: return urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=30).read().decode("utf-8","replace")
                  except Exception as e:
                      if i==2: raise
                      time.sleep(5)
          t=get(B); print("index len",len(t))
          print("pager", re.findall(r"createPageHTML\([^)]*\)|countPage\s*=\s*\d+",t)[:3])
          links=re.findall(r'href="\.?/?([^"]*t(\d{8})_\d+\.shtml)"[^>]*>([^<]{4,80})<',t)
          print("links p0",len(links),links[:5])
          arts=list(links)
          for n in range(1,400):
              try: t=get(f"{B}index_{n}.shtml")
              except Exception as e: print("stop",n,e); break
              ls=re.findall(r'href="\.?/?([^"]*t(\d{8})_\d+\.shtml)"[^>]*>([^<]{4,80})<',t)
              if not ls: print("empty",n); break
              arts+=ls
              if n%20==0: print("page",n,ls[-1][1],flush=True)
              time.sleep(0.4)
          print("articles",len(arts),"range",min(a[1] for a in arts),max(a[1] for a in arts))
          json.dump(arts,open("/tmp/out/arts.json","w"),ensure_ascii=False)
          # 抽 2020 年的文章看內文
          from collections import Counter
          print(Counter(a[1][:4] for a in arts))
          sample=[a for a in arts if a[1].startswith("2020")][:60]
          res=[]
          for path,d,title in sample:
              u=path if path.startswith("http") else B+path.lstrip("./")
              try: body=re.sub(r"<[^>]+>"," ",get(u))
              except Exception as e: print("ERR",u,e); continue
              m=re.findall(r"(?:出口集装箱综合运价指数|SCFI)[^。]{0,40}?(\d{3,4}\.\d{1,2})\s*点",body)
              res.append([d,title,m[:3]])
              print(d,title[:30],m[:3],flush=True)
              time.sleep(0.5)
          json.dump(res,open("/tmp/out/res2020.json","w"),ensure_ascii=False)
          PY
          tail -50 /tmp/out/news.txt
      - name: 推送
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/out && git init -q -b x && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && git commit -qm news && git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" x:refs/heads/wb-news
