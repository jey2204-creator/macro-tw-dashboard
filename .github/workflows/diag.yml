name: 資料來源連線診斷

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 上海航交所 SCFI 頁面探測
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/probe.log) 2>&1
          CH="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          mkdir -p /tmp/p && cd /tmp/p
          g(){ n=$1; u=$2; r=$(curl -s -L -c cj -b cj -A "$CH" -o "$n" -w "code=%{http_code} size=%{size_download}" -m 40 "$u"); echo "RESULT $n | $r | $u"; }
          for id in 2603 2609 2615; do
            curl -s -m 60 "https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockMonthRevenue&data_id=$id&start_date=2000-01-01&end_date=2026-10-25" -o rev_$id.json
            python3 -c "
          import json;d=json.load(open('rev_$id.json'));r=d.get('data') or []
          print('rev $id',d.get('status'),d.get('msg'),len(r))
          for x in r[:2]+r[-3:]: print('   ',x)
          "
          done
          curl -s -c ycj -A "$CH" -m 20 -o /dev/null https://fc.yahoo.com
          for sym in 2603.TW 2609.TW 2615.TW; do
            curl -s -A "$CH" -m 60 "https://query2.finance.yahoo.com/v8/finance/chart/$sym?period1=0&period2=1800000000&interval=1d&events=div,splits" -o y_$sym.json
            python3 -c "
          import json,datetime as dt
          j=json.load(open('y_$sym.json'));r=j['chart']['result'][0];ts=r['timestamp'];q=r['indicators']['quote'][0];a=(r['indicators'].get('adjclose') or [{}])[0].get('adjclose')
          print('$sym n',len(ts),'first',dt.datetime.utcfromtimestamp(ts[0]).date(),'adj?',a is not None)
          ev=r.get('events',{})
          for k in ('splits','dividends'):
            for v in sorted(ev.get(k,{}).values(),key=lambda x:x['date'])[-12:]: print('   ',k,dt.datetime.utcfromtimestamp(v['date']).date(),{kk:vv for kk,vv in v.items() if kk!='date'})
          c=q['close']
          for i in range(1,len(ts)):
            if c[i] and c[i-1] and abs(c[i]/c[i-1]-1)>0.12: print('   jump',dt.datetime.utcfromtimestamp(ts[i]).date(),round(c[i-1],2),'->',round(c[i],2),'adj',a and (round(a[i-1],2),round(a[i],2)))
          "
          done
          curl -s -m 30 -L https://raw.githubusercontent.com/DoiEnnoson/freight-indices-newsletter/main/data/scfi.csv | tail -3
      - name: 推送探測結果到 probe-out 分支
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/out && mkdir -p /tmp/out && cd /tmp/out
          cp /tmp/probe.log . ; cp /tmp/p/*.html /tmp/p/*.json . 2>/dev/null || true
          git init -q -b probe-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m probe
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" probe-out
