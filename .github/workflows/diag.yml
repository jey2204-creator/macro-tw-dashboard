name: 資料來源連線診斷

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 上海航交所 SCFI 頁面探測
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/probe.log) 2>&1
          CH="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          mkdir -p /tmp/p && cd /tmp/p
          g(){ n=$1; u=$2; r=$(curl -s -L -c cj -b cj -A "$CH" -o "$n" -w "code=%{http_code} size=%{size_download}" -m 40 "$u"); echo "RESULT $n | $r | $u"; }
          E="https://datacenter-web.eastmoney.com/api/data/v1/get"
          for d in 2026-10-23 2026-10-16 2026-10-24 2026-10-22; do
            for pg in 1 2 3; do
              curl -s -A "$CH" -m 40 -G "$E" --data-urlencode "reportName=RPT_INDUSTRY_INDEX" --data-urlencode "columns=REPORT_DATE,INDICATOR_ID,INDICATOR_NAME,INDICATOR_VALUE" --data-urlencode "filter=(REPORT_DATE='$d')" --data-urlencode "pageSize=500" --data-urlencode "pageNumber=$pg" --data-urlencode "sortColumns=INDICATOR_ID" --data-urlencode "sortTypes=1" --data-urlencode "source=WEB" --data-urlencode "client=WEB" -o em_$d_$pg.json
              python3 -c "
          import json,sys;d=json.load(open('em_$d_$pg.json'));r=d.get('result') or {};rows=r.get('data') or []
          print('$d p$pg', d.get('message'), 'pages',r.get('pages'),'count',r.get('count'))
          for x in rows: print('  ',x['INDICATOR_ID'],x['INDICATOR_NAME'],x['INDICATOR_VALUE'])
          "
            done
          done
      - name: 推送探測結果到 probe-out 分支
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/out && mkdir -p /tmp/out && cd /tmp/out
          cp /tmp/probe.log . ; cp /tmp/p/*.html /tmp/p/*.json . 2>/dev/null || true
          git init -q -b probe-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m probe
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" probe-out
