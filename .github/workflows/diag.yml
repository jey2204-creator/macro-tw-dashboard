name: 資料來源連線診斷

on:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  raw:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 下載 chineseshipping SCFI 存檔原檔
        shell: bash
        run: |
          mkdir -p /tmp/out/raw
          timeout 35m python3 -u - > /tmp/out/log.txt 2>&1 <<'PY'
          import json, urllib.request, urllib.parse, time, re
          UA="macro-tw-dashboard/0.1 (+https://github.com/jey2204-creator/macro-tw-dashboard)"
          def get(u,tries=4,timeout=40):
              for i in range(tries):
                  try: return urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=timeout).read()
                  except Exception as e:
                      if i==tries-1: raise
                      time.sleep(10*2**i)
          q=urllib.parse.urlencode({"url":"index.chineseshipping.com.cn","matchType":"prefix","output":"json","fl":"timestamp,original","filter":"statuscode:200","from":"2019","to":"2022"})
          rows=json.loads(get("https://web.archive.org/cdx/search/cdx?"+q,timeout=90) or b"[]")[1:]
          rows=[r for r in rows if "scfi" in r[1].lower()]
          seen=set(); n=0
          for ts,orig in sorted(rows):
              k=ts[:8]+re.sub(r"[?&](jc|_)=[^&]*","",orig)
              if k in seen: continue
              seen.add(k)
              try:
                  raw=get(f"https://web.archive.org/web/{ts}id_/{orig}")
                  open(f"/tmp/out/raw/{ts}_{re.sub(r'[^A-Za-z0-9]+','_',orig)[:80]}","wb").write(raw); n+=1
                  print("ok",ts,orig,len(raw))
              except Exception as e: print("ERR",ts,orig,str(e)[:60])
              time.sleep(2)
          print("saved",n,"of",len(seen))
          PY
          tail -3 /tmp/out/log.txt
      - name: 推送
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/out && git init -q -b x && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && git commit -qm raw && git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" x:refs/heads/wb-cs
