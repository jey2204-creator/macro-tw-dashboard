name: 資料來源連線診斷

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  wayback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        span: ['2009 2011', '2012 2014', '2015 2016', '2017 2017', '2018 2018', '2019 2019', '2020 2021', '2022 2023', '2024 2024', '2025 2026']
    steps:
      - uses: actions/checkout@v4
      - name: 回收 SCFI 存檔
        shell: bash
        run: |
          set +e
          read A B <<< "${{ matrix.span }}"
          mkdir -p /tmp/out
          timeout 25m python3 -u scripts/oneoff/scfi_wayback_seed.py $A $B /tmp/out/wb-$A-$B.json > /tmp/out/log-$A-$B.txt 2>&1
          tail -5 /tmp/out/log-$A-$B.txt
      - name: 推送結果
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          read A B <<< "${{ matrix.span }}"
          cd /tmp/out
          git init -q -b wb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "wb $A-$B"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" wb:refs/heads/wb-$A-$B
