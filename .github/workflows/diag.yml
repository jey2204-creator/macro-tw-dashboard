name: 資料來源連線診斷

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 上海航交所 SCFI 頁面探測
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/probe.log) 2>&1
          CH="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          mkdir -p /tmp/p && cd /tmp/p
          g(){ n=$1; u=$2; r=$(curl -s -L -c cj -b cj -A "$CH" -o "$n" -w "code=%{http_code} size=%{size_download}" -m 40 "$u"); echo "RESULT $n | $r | $u"; }
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, re, time
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          def get(url, headers=None):
              req=urllib.request.Request(url, headers={"User-Agent":UA, **(headers or {})})
              return urllib.request.urlopen(req, timeout=40).read().decode('utf-8','replace')
          kw="上海出口集装箱运价指数(综合指数)报"
          allrows=[]
          for page in range(1,8):
              param={"uid":"","keyword":kw,"type":["cmsArticleWebOld"],"client":"web","clientType":"web","clientVersion":"curr","param":{"cmsArticleWebOld":{"searchScope":"title","sort":"time","pageIndex":page,"pageSize":100,"preTag":"","postTag":""}}}
              url="https://search-api-web.eastmoney.com/search/jsonp?cb=cb&param="+urllib.parse.quote(json.dumps(param,ensure_ascii=False))
              try:
                  t=get(url,{"Referer":"https://so.eastmoney.com/"})
                  j=json.loads(t[t.index('(')+1:t.rindex(')')])
                  arts=j.get('result',{}).get('cmsArticleWebOld') or []
                  print('page',page,'n',len(arts), 'keys', list(arts[0].keys()) if arts else None)
                  for x in arts: allrows.append((x.get('date'),x.get('title')))
                  if not arts: break
              except Exception as e:
                  print('ERR',page,e); break
              time.sleep(1)
          allrows.sort()
          print('total',len(allrows))
          for r in allrows[:8]+allrows[-5:]: print('  ',r)
          yrs={}
          for d,_ in allrows: yrs[str(d)[:4]]=yrs.get(str(d)[:4],0)+1
          print('per-year',sorted(yrs.items()))
          PY
      - name: 推送探測結果到 probe-out 分支
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/out && mkdir -p /tmp/out && cd /tmp/out
          cp /tmp/probe.log . ; cp /tmp/p/*.html /tmp/p/*.json . 2>/dev/null || true
          git init -q -b probe-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m probe
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" probe-out
