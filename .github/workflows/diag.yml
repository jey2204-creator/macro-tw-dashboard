name: 資料來源連線診斷

on:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 中華航運網 集裝箱市場評述
        shell: bash
        run: |
          mkdir -p /tmp/out
          timeout 18m python3 -u - > /tmp/out/news.txt 2>&1 <<'PY'
          import urllib.request, urllib.parse, re, time, json, collections
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          def get(u,t=40,tries=4):
              for i in range(tries):
                  try: return urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=t).read().decode("utf-8","replace")
                  except Exception as e:
                      if i==tries-1: raise
                      time.sleep(10*2**i)
          urls=set()
          for host in ["info.chineseshipping.com.cn","www.chineseshipping.com.cn","chineseshipping.com.cn"]:
              q=urllib.parse.urlencode({"url":host+"/cninfo/MarketReport/","matchType":"prefix","output":"json","fl":"original","filter":"statuscode:200","from":"2019","to":"2021","collapse":"urlkey"})
              try:
                  rows=json.loads(get("https://web.archive.org/cdx/search/cdx?"+q,90) or "[]")[1:]
              except Exception as e: print("CDX ERR",host,e); continue
              for (o,) in rows:
                  m=re.search(r"MarketReport/(.*?/t(20\d{6})_\d+\.shtml)",o)
                  if m: urls.add((m.group(2),m.group(1)))
              print("CDX",host,len(rows),flush=True); time.sleep(5)
          urls=sorted(urls)
          print("article urls",len(urls),collections.Counter(d[:6] for d,_ in urls if d.startswith("2020")))
          res=[]
          for d,path in urls:
              if not d.startswith("2020"): continue
              u="https://info.chineseshipping.com.cn/cninfo/MarketReport/"+path
              try: body=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",get(u,30,2)))
              except Exception as e:
                  print("ERR",d,path,str(e)[:50]); continue
              m=re.findall(r"(?:出口集装箱综合运价指数|出口集装箱运价指数|SCFI)[^。]{0,60}?(\d{3,4}\.\d{1,2})\s*点",body)
              title=re.search(r"<title>(.*?)</title>",body)
              print(d,path[:40],m[:4],flush=True)
              res.append([d,path,m[:4]])
              time.sleep(0.5)
          json.dump(res,open("/tmp/out/res2020.json","w"),ensure_ascii=False)
          PY
          tail -50 /tmp/out/news.txt
      - name: 推送
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/out && git init -q -b x && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && git commit -qm news && git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" x:refs/heads/wb-news
