name: 資料來源連線診斷

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 上海航交所 SCFI 頁面探測
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/probe.log) 2>&1
          CH="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          mkdir -p /tmp/p && cd /tmp/p
          g(){ n=$1; u=$2; r=$(curl -s -L -c cj -b cj -A "$CH" -o "$n" -w "code=%{http_code} size=%{size_download}" -m 40 "$u"); echo "RESULT $n | $r | $u"; }
          g cur.json "https://en.sse.net.cn/currentIndex?indexName=scfi"
          head -c 1500 cur.json; echo
          g single.html "https://www.sse.net.cn/index/singleIndex?indexType=scfi"
          g list.html "https://www.sse.net.cn/index/scfilist"
          for f in single.html list.html; do
            echo "=== $f scripts/forms"
            grep -oiE '<script[^>]*src="[^"]+"|<form[^>]*>|<input[^>]*>|<select[^>]*>|action="[^"]*"' $f | head -40
            echo "=== $f inline url-ish"
            grep -oE "(url|href|action)\s*[:=]\s*['\"][^'\"]{3,120}['\"]|/[A-Za-z]+/[A-Za-z]*([Ll]ist|[Qq]uery|[Hh]ist|[Dd]ata|[Cc]hart)[A-Za-z]*[^'\" <]{0,80}" $f | sort -u | head -60
            echo "=== $f table sample"
            sed -e 's/<[^>]*>/ /g' $f | tr -s ' \n' | grep -E '20[0-9]{2}-[0-9]{2}-[0-9]{2}' | head -30
          done
          for s in $(grep -oE '<script[^>]*src="[^"]+"' list.html single.html | grep -oE 'src="[^"]+"' | cut -d'"' -f2 | grep -vE 'jquery|bootstrap|echarts.min|layui\.js' | sort -u); do
            case $s in http*) u=$s;; //*) u="https:$s";; /*) u="https://www.sse.net.cn$s";; *) u="https://www.sse.net.cn/index/$s";; esac
            curl -s -A "$CH" -m 30 -o js.tmp "$u"
            echo "=== JS $u $(wc -c < js.tmp)"
            grep -oE "['\"][^'\"]*(Index|index|scfi|List|list|query|Query|hist|History)[^'\"]*['\"]" js.tmp | sort -u | head -40
          done
          echo "=== try GET params"
          for q in "index/scfilist?startDate=2015-01-01&endDate=2015-03-01" "index/singleIndex?indexType=scfi&indexDate=2015-01-09" "index/singleIndex?indexType=scfi&date=2015-01-09" "index/scfilistAjax" "indexService/scfi/list" ; do
            g t.out "https://www.sse.net.cn/$q"; sed -e 's/<[^>]*>/ /g' t.out | tr -s ' \n' | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}[^0-9]{0,40}[0-9]{3,5}\.[0-9]+' | head -5
          done
          echo "=== list.html head"
          sed -e 's/<[^>]*>/ /g' list.html | tr -s ' \n' | head -c 2500
      - name: 推送探測結果到 probe-out 分支
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/out && mkdir -p /tmp/out && cd /tmp/out
          cp /tmp/probe.log . ; cp /tmp/p/*.html /tmp/p/*.json . 2>/dev/null || true
          git init -q -b probe-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m probe
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" probe-out
