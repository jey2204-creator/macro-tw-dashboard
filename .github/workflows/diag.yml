name: 資料來源連線診斷

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 上海航交所 SCFI 頁面探測
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/probe.log) 2>&1
          CH="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          mkdir -p /tmp/p && cd /tmp/p
          g(){ n=$1; u=$2; r=$(curl -s -L -c cj -b cj -A "$CH" -o "$n" -w "code=%{http_code} size=%{size_download}" -m 40 "$u"); echo "RESULT $n | $r | $u"; }
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, collections
          UA="macro-tw-dashboard/0.1 (+https://github.com/jey2204-creator/macro-tw-dashboard)"
          pats=["en.sse.net.cn/currentIndex*","www.sse.net.cn/index/singleIndex?indexType=scfi*","en.sse.net.cn/indices/scfinew.jsp*","www.sse.net.cn/indices/scfinew.jsp*","www1.sse.net.cn/indices/scfinew.jsp*","sse.net.cn/indices/scfinew.jsp*","www.sse.net.cn/index/scfi*","en.sse.net.cn/indices/*"]
          for p in pats:
              u="https://web.archive.org/cdx/search/cdx?"+urllib.parse.urlencode({"url":p,"output":"json","fl":"timestamp,original,statuscode,length","filter":"statuscode:200","limit":"20000"})
              try:
                  t=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=90).read().decode()
                  rows=json.loads(t)[1:] if t.strip() else []
                  yrs=collections.Counter(r[0][:4] for r in rows)
                  wk=collections.Counter(r[0][:4] for r in {(r[0][:8]):r for r in rows}.values())
                  print(p,len(rows),sorted(yrs.items()))
                  origs=collections.Counter(r[1] for r in rows).most_common(4); print('   top',origs)
              except Exception as e:
                  print(p,'ERR',e)
          PY
      - name: 推送探測結果到 probe-out 分支
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/out && mkdir -p /tmp/out && cd /tmp/out
          cp /tmp/probe.log . ; cp /tmp/p/*.html /tmp/p/*.json . 2>/dev/null || true
          git init -q -b probe-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m probe
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" probe-out
