name: 資料來源連線診斷

on:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 探測 chineseshipping 指定日期
        shell: bash
        run: |
          mkdir -p /tmp/out
          CH="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          {
          for d in "" 2020-05-15 2020-05-14 2015-01-09 2010-06-11; do
            for h in http https; do
              echo "== $h $d"; curl -s -L -A "$CH" -m 30 -w "\ncode=%{http_code}\n" "$h://index.chineseshipping.com.cn/servlet/scfiGetContrast?SpecifiedDate=$d&jc=cb" | head -c 500; echo
            done
          done
          echo "== home"; curl -s -L -A "$CH" -m 30 -o /dev/null -w "code=%{http_code} url=%{url_effective}\n" "http://index.chineseshipping.com.cn/"
          } > /tmp/out/live.txt 2>&1
          cat /tmp/out/live.txt
      - name: 推送
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/out && git init -q -b x && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && git commit -qm live && git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" x:refs/heads/wb-live
