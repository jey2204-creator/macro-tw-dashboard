name: 資料來源連線診斷

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 上海航交所 SCFI 頁面探測
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/probe.log) 2>&1
          CH="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          mkdir -p /tmp/p && cd /tmp/p
          g(){ n=$1; u=$2; r=$(curl -s -L -c cj -b cj -A "$CH" -o "$n" -w "code=%{http_code} size=%{size_download}" -m 40 "$u"); echo "RESULT $n | $r | $u"; }
          E="https://datacenter-web.eastmoney.com/api/data/v1/get"
          curl -s -A "$CH" -m 40 "$E?sortColumns=REPORT_DATE&sortTypes=-1&pageSize=500&pageNumber=1&reportName=RPT_INDUSTRY_INDEX&columns=REPORT_DATE,INDICATOR_ID,INDICATOR_NAME,INDICATOR_VALUE&source=WEB&client=WEB" -o em_all.json
          echo "em_all size $(wc -c < em_all.json)"; head -c 300 em_all.json; echo
          python3 -c "
          import json;d=json.load(open('em_all.json'));r=d.get('result') or {};rows=r.get('data') or []
          print('pages',r.get('pages'),'count',r.get('count'))
          seen={}
          for x in rows: seen.setdefault(x.get('INDICATOR_ID'),(x.get('INDICATOR_NAME'),x.get('REPORT_DATE'),x.get('INDICATOR_VALUE')))
          for k,v in seen.items():
            n=str(v[0])
            if any(t in n for t in ['集装箱','运价','SCFI','CCFI','航运','BDI','波罗的海','运费']): print('HIT',k,v)
          print('distinct',len(seen))
          "
          for f in '(INDICATOR_NAME like \"%集装箱%\")' '(INDICATOR_NAME like \"%SCFI%\")'; do
            curl -s -A "$CH" -m 40 -G "$E" --data-urlencode "reportName=RPT_INDUSTRY_INDEX" --data-urlencode "columns=REPORT_DATE,INDICATOR_ID,INDICATOR_NAME,INDICATOR_VALUE" --data-urlencode "filter=$f" --data-urlencode "pageSize=50" --data-urlencode "sortColumns=REPORT_DATE" --data-urlencode "sortTypes=-1" --data-urlencode "source=WEB" --data-urlencode "client=WEB" | head -c 1500; echo
          done
          for id in EMI00107664 EMI00107665 EMI00107667 EMI00107668 EMI00107669 EMI00107670 EMI00107671 EMI00107672 EMI00238133 EMI00238134 EMI00238135; do
            echo -n "$id -> "; curl -s -A "$CH" -m 40 -G "$E" --data-urlencode "reportName=RPT_INDUSTRY_INDEX" --data-urlencode "columns=REPORT_DATE,INDICATOR_ID,INDICATOR_NAME,INDICATOR_VALUE" --data-urlencode "filter=(INDICATOR_ID=\"$id\")" --data-urlencode "pageSize=1" --data-urlencode "sortColumns=REPORT_DATE" --data-urlencode "sortTypes=-1" --data-urlencode "source=WEB" --data-urlencode "client=WEB" | head -c 300; echo
          done
      - name: 推送探測結果到 probe-out 分支
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/out && mkdir -p /tmp/out && cd /tmp/out
          cp /tmp/probe.log . ; cp /tmp/p/*.html /tmp/p/*.json . 2>/dev/null || true
          git init -q -b probe-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m probe
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" probe-out
