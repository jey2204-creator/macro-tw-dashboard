name: ETF 融資探測

on:
  push:
    branches: [etf-margin-probe]
    paths: ['scripts/fetch-data/etfMarginProbe.ts', '.github/workflows/etf-margin-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fetch-data/etfMarginProbe.ts 2010-03-02,2015-08-24,2018-10-11,2020-03-19,2021-05-12,2022-10-25,2023-12-29,2024-08-05,2025-04-09,2025-12-31,2026-06-30,2026-10-12,2026-11-06,2026-11-19
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe-out/etf-margin-probe.json
          git commit -m "probe: ETF 融資探測結果"
          git push
