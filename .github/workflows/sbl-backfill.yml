name: 借券賣出歷史回補

# 一次性：把上市借券賣出餘額（證交所 TWT93U 逐檔加總）回補到 2010 年，存進 data/sbl-history.json，供借券比率化與事件回測。
# 每個交易日 1 個請求、約 10～12 秒，每天約 3.5 秒，全部約 4～5 小時；每次執行最多 5 小時，未完成會自動接著跑下一次。
# 完成（或每段結束）後會觸發「更新資料並部署」，網站即顯示最新的回測結果。
# probe：只測試指定日期能否解析（逗號分隔），不寫檔。

on:
  workflow_dispatch:
    inputs:
      probe:
        description: '只測試這些日期（例如 2010-03-02,2013-01-02,2020-03-19），留空＝正式回補'
        type: string
        default: ''
      target:
        description: '回補到哪一天（最早）'
        type: string
        default: '2010-01-04'
      kind:
        description: 'sell＝借券賣出餘額（TWT93U）；lend＝借券餘額（TWT72U 借貸系統）'
        type: choice
        options: [sell, lend]
        default: 'sell'

permissions:
  contents: write
  actions: write

concurrency:
  group: sbl-backfill-${{ inputs.kind || 'sell' }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 測試解析
        if: ${{ inputs.probe != '' }}
        run: npx tsx scripts/fetch-data/sblBackfill.ts --kind "${{ inputs.kind || 'sell' }}" --probe "${{ inputs.probe }}"

      - name: 回補
        id: run
        if: ${{ inputs.probe == '' }}
        continue-on-error: true
        run: npx tsx scripts/fetch-data/sblBackfill.ts --kind "${{ inputs.kind || 'sell' }}" --target "${{ inputs.target }}" --budget-min 300

      - name: 提交進度
        if: ${{ inputs.probe == '' && always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          f=data/sbl-history.json; label=借券賣出
          if [ "${{ inputs.kind || 'sell' }}" = "lend" ]; then f=data/sbl-lend-history.json; label=借券餘額; fi
          git add "$f"
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          rows=$(grep -c '^\["' "$f" || true)
          git commit -m "data: ${label}歷史回補（共 ${rows} 天）"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: 接續下一段
        if: ${{ inputs.probe == '' && steps.run.outputs.remaining == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sbl-backfill.yml -f target="${{ inputs.target }}" -f kind="${{ inputs.kind || 'sell' }}"

      - name: 重新部署網站
        if: ${{ inputs.probe == '' && always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-and-deploy.yml
