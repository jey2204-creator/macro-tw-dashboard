name: 期交所資料格式探測

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/taifex-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 探測選擇權買賣權分計與大額交易人
        shell: bash
        run: |
          set +e
          ME="macro-tw-dashboard/0.1 (+https://github.com/jey2204-creator/macro-tw-dashboard)"
          p(){ n=$1; url=$2; shift 2; curl -s -w "%{http_code} %{size_download}" -A "$ME" -m 40 -X POST "$url" "$@" -o /tmp/raw > /tmp/code; rm -f /tmp/u; iconv -f big5 -t utf-8 /tmp/raw > /tmp/u 2>/dev/null || cp /tmp/raw /tmp/u;
               echo "::notice title=$n head::$(cat /tmp/code) $(head -c 1500 /tmp/u | tr '\r\n' ' |')";
               echo "::notice title=$n match::$(grep -E "$PAT" /tmp/u | head -12 | tr '\r\n' ' |' | head -c 3000)"; }
          PAT='^20[0-9/]+,TX '
          p large-1014 https://www.taifex.com.tw/cht/3/largeTraderFutDown -d queryStartDate=2026/10/13 -d queryEndDate=2026/10/14
          p large-1015 https://www.taifex.com.tw/cht/3/largeTraderFutDown -d queryStartDate=2026/10/15 -d queryEndDate=2026/10/15
          p large-1yr https://www.taifex.com.tw/cht/3/largeTraderFutDown -d queryStartDate=2025/10/14 -d queryEndDate=2026/10/14
          p large-2mo https://www.taifex.com.tw/cht/3/largeTraderFutDown -d queryStartDate=2026/08/14 -d queryEndDate=2026/10/14
          PAT='外資'
          p opt-2yr https://www.taifex.com.tw/cht/3/callsAndPutsDateDown -d queryStartDate=2024/10/16 -d queryEndDate=2025/10/14 -d commodityId=TXO
          p opt-3yr https://www.taifex.com.tw/cht/3/callsAndPutsDateDown -d queryStartDate=2023/10/16 -d queryEndDate=2024/01/10 -d commodityId=TXO
          wc -l /tmp/u
